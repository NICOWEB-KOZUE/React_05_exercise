<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習記録アプリ</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: sans-serif;
    background: #e8e8e8;
    padding: 40px;
    color: #111;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    padding: 28px 32px 32px;
    border: 1px solid #d0d0d0;
    border-radius: 12px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 32px;
    font-weight: 700;
  }

  .form-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  input {
    padding: 10px 12px;
    border: 1px solid #cfcfcf;
    border-radius: 8px;
    font-size: 16px;
  }

  .input-subject {
    flex: 1;
    min-width: 0;
  }

  .input-minutes {
    width: 140px;
    flex-shrink: 0;
  }

  .btn-add {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-add:hover {
    background: #1d4ed8;
  }

  .error {
    margin: 10px 0 0;
    color: #e11d48;
    font-size: 14px;
  }

  .summary {
    margin-top: 16px;
    padding: 14px 16px;
    background: #f3f3f3;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-weight: 700;
  }

  .empty {
    margin: 16px 0 0;
    color: #666;
  }

  .log-list {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .log-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    background: #fff;
  }

  .log-subject {
    flex: 1;
  }

  .log-minutes {
    width: 64px;
    text-align: left;
  }

  .btn-delete {
    padding: 6px 14px;
    border: 1px solid #c8c8c8;
    border-radius: 6px;
    background: #fff;
    color: #111;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-delete:hover {
    background: #f5f5f5;
  }
  </style>

</head>

<body>
  <div id="root"></div>


  <script type="text/babel">

    const { useState } = React;

    function App() {
      const [logs, setLogs] = useState([]);
      const [subject, setSubject] = useState("");
      const [minutes, setMinutes] = useState("");
      const [error, setError] = useState("");

      const addLog = () => {
        if (subject.trim() === "" || minutes === "" || Number(minutes) <= 0) {
          setError("科目名と1分以上の時間を入力してください");
          return;
        }
        const newLog = {
          id: Date.now(),
          subject: subject,
          minutes: Number(minutes),
        };

        setLogs([...logs, newLog]);

        setSubject("");
        setMinutes("");
        setError("");
      };

      const deleteLog = (id) => {
        const newLogs = logs.filter((log) => {
          return log.id !== id;
        });

        setLogs(newLogs);
      };

      const totalCount = logs.length;

      const totalMinutes = logs.reduce(
        (sum, log) => sum + log.minutes,
        0
      );

      return (
        <main>
          <h1>学習記録</h1>

          <div className="form-row">
            <input
              className="input-subject"
              value={subject}
              onChange={(event) => setSubject(event.target.value)}
              placeholder="科目名を入力"
            />

            <input
              className="input-minutes"
              value={minutes}
              onChange={(event) => setMinutes(event.target.value)}
              placeholder="時間(分)"
            />

            <button className="btn-add" onClick={addLog}>記録する</button>
          </div>

          {error && <p className="error">{error}</p>}

          <p className="summary">
            合計: {totalCount}件 / {totalMinutes}分
          </p>

          {logs.length === 0 && (
            <p className="empty">まだ記録がありません</p>
          )}

          <ul className="log-list">
            {logs.map((log) => (
              <li key={log.id} className="log-item">
                <span className="log-subject">{log.subject}</span>
                <span className="log-minutes">{log.minutes}分</span>
                <button className="btn-delete" onClick={() => deleteLog(log.id)}>
                  削除
                </button>
              </li>
            ))}
          </ul>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>

</html>
