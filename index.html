<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習記録アプリ</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
  body {
    font-family: sans-serif;
    background: #f5f5f5;
    padding: 40px;
  }

  main {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  h1 {
    margin-top: 0;
  }
  
  input {
    padding: 8px;
    margin-right: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  button {
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  ul {
    padding-left: 20px;
  }

  li {
    margin-bottom: 10px;
  }

  li button {
    margin-left: 12px;
  }

  .error {
    color: #c62828;
    background: #ffebee;
    padding: 8px;
    border-radius: 4px;
  }
  </style>

</head>

<body>
  <div id="root"></div>


  <script type="text/babel">

    const { useState } = React;

    function App() {
      const [logs, setLogs] = useState([]);
      const [subject, setSubject] = useState("");
      const [minutes, setMinutes] = useState("");
      const [error, setError] = useState("");

      const addLog = () => {
        if (subject.trim() === "" || minutes === "" || Number(minutes) <= 0) {
          setError("科目名と1分以上の時間を入力してください");
          return;
        }
        const newLog = {
          id: Date.now(),
          subject: subject,
          minutes: Number(minutes),
        };

        setLogs([...logs, newLog]);

        setSubject("");
        setMinutes("");
        setError("");
      };

      const deleteLog = (id) => {
        const newLogs = logs.filter((log) => {
          return log.id !== id;
        });

        setLogs(newLogs);
      };

      const totalCount = logs.length;

      const totalMinutes = logs.reduce(
        (sum, log) => sum + log.minutes,
        0
      );

      return (
        <main>
          <h1>学習記録</h1>

          <input
            value={subject}
            onChange={(event) => setSubject(event.target.value)}
            placeholder="科目名を入力"
          />

          <input
            value={minutes}
            onChange={(event) => setMinutes(event.target.value)}
            placeholder="時間(分)"
          />

          <button onClick={addLog}>記録する</button>

          {error && <p className="error">{error}</p>}

          <p>
            合計: {totalCount}件 / {totalMinutes}分
          </p>

          {logs.length === 0 && (
            <p>まだ記録がありません</p>
          )}

          <ul>
            {logs.map((log) => (
              <li key={log.id}>
                {log.subject} {log.minutes}分

                <button onClick={() => deleteLog(log.id)}>
                  削除
                </button>
              </li>
            ))}
          </ul>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>

</html>
